<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=./4dgs-culture/">
  <title>4DGS for Cultural Heritage & Historical Site Preservation</title>
  <style>
    :root {
      --bg: #081019;
      --ink: #f6fbff;
      --muted: #b9c7d5;
      --cyan: #48d6ff;
      --amber: #ffbe63;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 15% 12%, rgba(72, 214, 255, 0.18), transparent 28rem),
        radial-gradient(circle at 82% 18%, rgba(255, 190, 99, 0.14), transparent 30rem),
        linear-gradient(135deg, #06101a 0%, #0b1722 54%, #171116 100%);
      color: var(--ink);
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
    }

    main {
      width: min(820px, calc(100vw - 32px));
      padding: 38px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      background: rgba(8, 16, 25, 0.74);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.36);
    }

    .eyebrow {
      color: var(--amber);
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    h1 {
      margin: 14px 0 16px;
      font-size: clamp(40px, 6vw, 72px);
      line-height: 1;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.55;
    }

    a {
      color: var(--cyan);
      font-weight: 900;
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">4DGS Heritage Deck</div>
    <h1>Đang mở slide 4DGS</h1>
    <p>Nếu trình duyệt không tự chuyển, mở trực tiếp
      <a href="./4dgs-culture/">4dgs-culture</a>.
    </p>
  </main>
  <script>
    window.location.replace("./4dgs-culture/");
  </script>
</body>
</html>
