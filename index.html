<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=./docs/slides/deepface-access-deck.html">
  <title>DeepFace Access Control Slides</title>
  <style>
    :root {
      --bg: #06130f;
      --ink: #eefcf4;
      --muted: #a7c4b7;
      --mint: #baf8d7;
      --gold: #f4c769;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      color: var(--ink);
      font-family: "Aptos", "Segoe UI Variable Text", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 10% 15%, rgba(84, 217, 140, .18), transparent 28rem),
        radial-gradient(circle at 85% 8%, rgba(244, 199, 105, .16), transparent 28rem),
        linear-gradient(135deg, #020806 0%, #06130f 52%, #10291f 100%);
    }

    main {
      width: min(760px, calc(100vw - 32px));
      padding: 38px;
      border: 1px solid rgba(238, 252, 244, .16);
      border-radius: 28px;
      background: rgba(255, 255, 255, .075);
      box-shadow: 0 30px 90px rgba(0, 0, 0, .34);
    }

    .eyebrow {
      color: var(--gold);
      font-weight: 900;
      letter-spacing: .16em;
      text-transform: uppercase;
      font-size: 12px;
    }

    h1 {
      margin: 12px 0;
      font-size: clamp(42px, 7vw, 78px);
      line-height: .98;
      letter-spacing: -.055em;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.55;
    }

    a {
      color: var(--mint);
      font-weight: 900;
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">DeepFace Access Control</div>
    <h1>Đang mở slide HTML</h1>
    <p>Nếu trình duyệt không tự chuyển, mở trực tiếp
      <a href="./docs/slides/deepface-access-deck.html">deepface-access-deck.html</a>.
    </p>
  </main>
  <script>
    window.location.replace("./docs/slides/deepface-access-deck.html");
  </script>
</body>
</html>
