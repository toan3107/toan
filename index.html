<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="0; url=./4dgs-culture/" />
  <title>Vistara4D Demo</title>
  <style>
    :root {
      --mint: #e9f5ef;
      --paper: #fbfffb;
      --teal: #087c71;
      --yellow: #ffda52;
      --ink: #173d39;
      --muted: #5d7672;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: var(--ink);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at 16% 8%, rgba(55, 213, 199, 0.22), transparent 28%),
        radial-gradient(circle at 88% 10%, rgba(255, 218, 82, 0.24), transparent 30%),
        linear-gradient(145deg, #f8fff9 0%, var(--mint) 58%, #d8f0e9 100%);
    }

    main {
      width: min(760px, calc(100vw - 32px));
      padding: 32px;
      border: 1px solid rgba(8, 124, 113, 0.16);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 18px 45px rgba(5, 83, 74, 0.15);
    }

    .stamp {
      width: 66px;
      height: 66px;
      border: 3px solid #bf624b;
      color: #bf624b;
      display: grid;
      place-items: center;
      font-weight: 900;
      line-height: 0.9;
      text-align: center;
      transform: rotate(-2deg);
      background: rgba(255, 255, 255, 0.55);
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 12px;
      color: var(--teal);
      font-size: clamp(34px, 5vw, 58px);
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.55;
    }

    a {
      color: var(--teal);
      font-weight: 900;
    }
  </style>
</head>
<body>
  <main>
    <div class="stamp">VISTARA<br />4D</div>
    <h1>Đang mở Vistara4D Demo</h1>
    <p>Nếu trình duyệt không tự chuyển, mở trực tiếp
      <a href="./4dgs-culture/">4dgs-culture</a>.
    </p>
  </main>
  <script>
    window.location.replace("./4dgs-culture/");
  </script>
</body>
</html>
